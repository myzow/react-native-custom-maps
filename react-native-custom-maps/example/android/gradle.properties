# Choose the Android map provider used by react-native-custom-maps.
# One of: google | osm   (default: osm)
customMapsProvider=osm

# Required for the New Architecture (Fabric + TurboModules).
newArchEnabled=true
hermesEnabled=true

# RN defaults.
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
